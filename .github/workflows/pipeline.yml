name: Launcher Server

on:
  push:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 3.1.101
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet publish --configuration Release --no-restore --output ./out
      
    #- name: Stop Server Warp Service
    #  uses: appleboy/ssh-action@master
      #with:
      #  host: ${{ secrets.HOST }}
      #  username: ${{ secrets.USERNAME }}
      #  password: ${{ secrets.PASSWORD }}
      #  port: ${{ secrets.PORT }}
      #  script: echo ${{ secrets.PASSWORD }} | sudo -S systemctl stop warp.service
        
        
    - name: Stop Server Warp Service
      uses: garygrossgarten/github-action-ssh@v0.5.0
      with:
        # Command to execute on the remote server.
        command: sudo -S systemctl stop warp.service
        # Hostname or IP address of the server.
        host: ${{ secrets.HOST }}
        # Username for authentication.
        username: ${{ secrets.USERNAME }}
        # Port number of the server.
        port: ${{ secrets.PORT }}
        # Password for password-based user authentication.
        password: ${{ secrets.PASSWORD }}
        
        
        
        
    - name: Copy
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT }}
        overwrite: true
        source: "./out/*"
        target: "~/launcher-server"

    - name: Start Server Warp Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT }}
        script: echo ${{ secrets.PASSWORD }} | sudo -S systemctl start warp.service
        
    - uses: actions/upload-artifact@v1
      name: Publish Artifact
      with:
        name: launcher-server
        path: ./out
